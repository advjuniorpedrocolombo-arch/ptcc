<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PTCC — Área do Grupo</title><style>:root{--navy:#07364a;--bg:#f3f6f7;--line:#d8e2e6;--muted:#687b84;--ok:#24744f;--bad:#96372f;--warn:#946400;--info:#2a6380}*{box-sizing:border-box}body{margin:0;font:15px/1.45 Segoe UI,Arial,sans-serif;background:var(--bg);color:#17313d}header{background:var(--navy);color:#fff;padding:18px}.wrap{width:min(1100px,calc(100% - 28px));margin:auto}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin:20px auto;box-shadow:0 9px 24px rgba(7,54,74,.07)}h1,h2{color:var(--navy)}label{font-weight:800;font-size:.8rem;display:block;margin-top:12px}input{width:100%;padding:10px;border:1px solid #cbd9df;border-radius:9px;margin-top:5px}.btn{border:0;border-radius:9px;padding:9px 12px;background:var(--navy);color:#fff;font-weight:850;cursor:pointer;margin-top:8px}.btn.alt{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn.good{background:var(--ok)}.hidden{display:none!important}.result{display:none;margin-top:12px;padding:12px;border-radius:9px}.result.ok{display:block;background:#e9f6ef;color:#205b40}.result.err{display:block;background:#fff0ef;color:#8b3129}.result.info{display:block;background:#eaf3f7;color:#285a70}.muted{color:var(--muted)}.toprow{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}.summary{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:16px}.card{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}.progress{height:12px;border-radius:999px;background:#e7edf0;overflow:hidden;margin-top:8px}.progress>span{display:block;height:100%;background:var(--ok)}.stage-list{display:grid;gap:12px}.stage{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff}.stage.open{border-color:#9ccbb4}.stage-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.stage-title{display:flex;gap:10px}.stage-num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#eaf1f4;color:var(--navy);font-weight:900}.chip{display:inline-block;padding:5px 9px;border-radius:999px;background:#edf2f4;font-size:.72rem;font-weight:900}.chip.good{background:#e9f6ef;color:#205b40}.chip.warn{background:#fff6db;color:#755200}.chip.bad{background:#fff0ef;color:#8b3129}.chip.info{background:#e7f1f6;color:#285a70}.dates{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0;color:#52636b;font-size:.88rem}.delivery{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}.upload-box{margin-top:10px;padding:12px;border:1px dashed #b8cbd4;border-radius:10px;background:#f8fbfc}.history{margin-top:10px;display:grid;gap:8px}.history-item{padding:10px;border:1px solid var(--line);border-radius:9px;background:#fafcfd}.feedback{margin-top:8px;padding:10px;border-radius:9px;background:#fff7e6;border:1px solid #efd28e}.members-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.member{padding:9px;border:1px solid var(--line);border-radius:9px}.small{font-size:.82rem}@media(max-width:760px){.summary,.members-grid{grid-template-columns:1fr}.stage-head{display:block}}</style></head><body><header><div class="wrap"><b>PTCC — Área do Grupo</b><div style="font-size:.85rem;opacity:.8">Técnico em Marketing • Etec Extensão Ibiúna</div></div></header><main class="wrap"><section id="loginPanel" class="panel"><h1>Acesso do grupo</h1><p class="muted">Use o mesmo e-mail informado no Termo de Compromisso.</p><form id="loginForm"><label>E-mail<input id="email" type="email" required></label><label>Senha<input id="password" type="password" required></label><button class="btn">Entrar</button></form><button class="btn alt" id="forgotBtn" type="button">Esqueci minha senha</button><div id="loginResult" class="result"></div></section><section id="setPasswordPanel" class="panel hidden"><h2>Crie sua senha</h2><label>Nova senha<input id="newPassword" type="password" minlength="6"></label><button class="btn" id="savePasswordBtn">Salvar senha e entrar</button><div id="setResult" class="result"></div></section><section id="groupPanel" class="hidden"><div class="panel"><div class="toprow"><div><h1 id="groupTitle" style="margin:0"></h1><div id="groupTheme" class="muted"></div></div><button class="btn alt" id="logoutBtn">Sair</button></div><div class="summary"><div class="card"><b>Progresso do PTCC</b><div id="progressText" class="muted small"></div><div class="progress"><span id="progressBar" style="width:0%"></span></div><div id="nextStage" style="margin-top:10px"></div></div><div class="card"><b>Situação</b><div style="margin-top:8px"><span class="chip good">Grupo ativo</span></div></div></div><div class="card" style="margin-top:14px"><b>Integrantes</b><div id="members" class="members-grid"></div></div><div id="groupResult" class="result"></div></div><div class="panel"><h2 style="margin-top:0">Etapas e entregas</h2><p class="muted">Acompanhe prazos, entregas e devolutivas do professor.</p><div id="stages" class="stage-list"></div></div></section></main><script>
const SUPA='https://klkpkjkvwsojlovguhcf.supabase.co',KEY='sb_publishable_18SoR1Y51JG0him_HZvoBA_6ojb5DRw',AT='ptcc_student_access_token',RT='ptcc_student_refresh_token',$=id=>document.getElementById(id);let token='',GROUP=null,USER=null,STAGES=[],GROUP_STAGES=[],SUBS=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function show(id,t,m){const e=$(id);e.className='result '+t;e.innerHTML=m}function store(a,r){token=a;localStorage.setItem(AT,a);if(r)localStorage.setItem(RT,r)}function headers(extra={}){return{apikey:KEY,Authorization:'Bearer '+token,...extra}}async function rest(path){const r=await fetch(SUPA+'/rest/v1/'+path,{headers:headers()});if(!r.ok){let j={};try{j=await r.json()}catch{}throw new Error(j.message||'Erro ao carregar dados.')}return r.json()}async function rpc(fn,body={}){const r=await fetch(SUPA+'/rest/v1/rpc/'+fn,{method:'POST',headers:headers({'Content-Type':'application/json'}),body:JSON.stringify(body)});let j=null;try{j=await r.json()}catch{}if(!r.ok)throw new Error(j?.message||j?.details||'Falha na operação.');return j}async function authUser(){const r=await fetch(SUPA+'/auth/v1/user',{headers:headers()});if(!r.ok)throw new Error('Sessão inválida.');return r.json()}function dateBR(v){if(!v)return'—';const[y,m,d]=v.slice(0,10).split('-');return`${d}/${m}/${y}`}function dateTimeBR(v){if(!v)return'—';return new Date(v).toLocaleString('pt-BR')}function todayISO(){const d=new Date();return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function isOpen(st){const t=todayISO();if(st.release_mode==='PROFESSOR'&&!st.manually_released)return false;if(st.release_mode==='DATE'&&st.opens_on&&t<st.opens_on)return false;if(st.due_on&&t>st.due_on)return false;return true}function statusInfo(st,gs){const s=gs?.status||'NOT_STARTED';if(s==='APPROVED')return['Aprovada','good',false];if(s==='IN_REVIEW')return['Em análise','info',isOpen(st)];if(s==='CHANGES_REQUESTED')return['Ajustes solicitados','warn',isOpen(st)];if(!isOpen(st)){if(st.due_on&&todayISO()>st.due_on)return['Prazo encerrado','bad',false];return['Ainda não iniciada','',false]}return['Aberta','good',true]}function safeName(n){return String(n||'arquivo').replace(/[^a-zA-Z0-9._-]+/g,'_').slice(-120)}async function openStored(path){try{const r=await fetch(SUPA+'/storage/v1/object/authenticated/ptcc-v2/'+path.split('/').map(encodeURIComponent).join('/'),{headers:headers()});if(!r.ok)throw new Error('Não foi possível abrir o arquivo.');const blob=await r.blob(),u=window.URL.createObjectURL(blob);window.open(u,'_blank','noopener');setTimeout(()=>window.URL.revokeObjectURL(u),60000)}catch(e){show('groupResult','err',esc(e.message))}}window.openStored=openStored;
function renderStages(){let approved=0,next=null;const html=STAGES.map((st,i)=>{const gs=GROUP_STAGES.find(x=>x.stage_id===st.id),info=statusInfo(st,gs),hist=SUBS.filter(s=>s.stage_id===st.id).sort((a,b)=>b.version-a.version),latest=hist[0];if(info[0]==='Aprovada')approved++;if(!next&&info[0]!=='Aprovada')next={st,info};let action='';if(st.accepts_file&&info[2]&&info[0]!=='Aprovada')action=`<div class="upload-box"><b>${latest?'Enviar nova versão':'Enviar arquivo da etapa'}</b><div class="muted small">PDF, DOC, DOCX ou ODT • máximo 20 MB.</div><input id="file-${st.id}" type="file" accept=".pdf,.doc,.docx,.odt"><button class="btn good" onclick="uploadStage('${st.id}')">${latest?'Enviar nova versão':'Enviar arquivo'}</button></div>`;else if(st.accepts_file&&info[0]!=='Aprovada')action='<div class="muted small">O envio será habilitado quando a etapa estiver aberta.</div>';const history=hist.length?`<div class="history"><b class="small">Histórico de entregas</b>${hist.map(s=>{const lab=s.status==='APPROVED'?'Aprovado':s.status==='CHANGES_REQUESTED'?'Ajustes solicitados':'Em análise',cl=s.status==='APPROVED'?'good':s.status==='CHANGES_REQUESTED'?'warn':'info';return`<div class="history-item"><span class="chip ${cl}">${lab}</span> <b>Versão ${s.version}</b> • ${dateTimeBR(s.submitted_at)}<div class="small">Protocolo: <b>${esc(s.protocol)}</b></div><button class="btn alt" onclick="openStored('${esc(s.file_path)}')">Abrir ${esc(s.original_filename)}</button>${s.professor_feedback?`<div class="feedback"><b>Orientação do professor:</b><br>${esc(s.professor_feedback)}${s.feedback_file_path?`<br><button class="btn alt" onclick="openStored('${esc(s.feedback_file_path)}')">Abrir PDF com correções</button>`:''}</div>`:''}</div>`}).join('')}</div>`:'';return`<div class="stage ${info[2]?'open':''}"><div class="stage-head"><div class="stage-title"><div class="stage-num">${i+1}</div><div><b>${esc(st.name)}</b>${st.description?`<div class="muted small">${esc(st.description)}</div>`:''}</div></div><span class="chip ${info[1]}">${info[0]}</span></div><div class="dates"><span><b>Abertura:</b> ${dateBR(st.opens_on)}</span><span><b>Prazo:</b> ${dateBR(st.due_on)}</span></div><div class="delivery">${action}${history}</div></div>`}).join('');$('stages').innerHTML=html;const pct=STAGES.length?Math.round(approved/STAGES.length*100):0;$('progressText').textContent=`${approved} de ${STAGES.length} etapas aprovadas • ${pct}% concluído`;$('progressBar').style.width=pct+'%';$('nextStage').innerHTML=next?`<b>Próxima etapa:</b> ${esc(next.st.name)} <span class="chip ${next.info[1]}">${next.info[0]}</span>`:'<span class="chip good">Todas as etapas concluídas</span>'}
async function loadGroup(){const gid=await rpc('ptcc_v2_student_group');if(!gid)throw new Error('Seu grupo ainda não foi liberado pelo professor.');const[g,m,st,gs,sub]=await Promise.all([rest('ptcc_v2_groups?id=eq.'+encodeURIComponent(gid)+'&select=*'),rest('ptcc_v2_members?group_id=eq.'+encodeURIComponent(gid)+'&select=name,email,member_role'),rest('ptcc_v2_stages?active=eq.true&select=id,code,name,description,sort_order,release_mode,opens_on,due_on,manually_released,accepts_file&order=sort_order.asc'),rest('ptcc_v2_group_stages?group_id=eq.'+encodeURIComponent(gid)+'&select=*'),rest('ptcc_v2_submissions?group_id=eq.'+encodeURIComponent(gid)+'&select=id,group_id,stage_id,version,protocol,file_path,original_filename,submitted_by,submitted_email,status,professor_feedback,feedback_file_path,feedback_original_filename,submitted_at,reviewed_at&order=submitted_at.desc')]);GROUP=g[0];if(!GROUP)throw new Error('Grupo não encontrado.');STAGES=st;GROUP_STAGES=gs;SUBS=sub;USER=await authUser();$('groupTitle').textContent=GROUP.code+' — '+GROUP.name;$('groupTheme').textContent=GROUP.theme||'';$('members').innerHTML=m.map(x=>`<div class="member"><b>${esc(x.name)}</b><div class="muted small">${esc(x.member_role)}</div><div class="small">${esc(x.email)}</div></div>`).join('');renderStages();$('loginPanel').classList.add('hidden');$('setPasswordPanel').classList.add('hidden');$('groupPanel').classList.remove('hidden')}
window.uploadStage=async stageId=>{const st=STAGES.find(x=>x.id===stageId),gs=GROUP_STAGES.find(x=>x.stage_id===stageId),info=statusInfo(st,gs),file=$('file-'+stageId)?.files?.[0];try{if(!info[2])throw new Error('Esta etapa não está aberta para envio.');if(!file)throw new Error('Selecione o arquivo.');if(file.size>20*1024*1024)throw new Error('Arquivo acima de 20 MB.');const ext=(file.name.split('.').pop()||'').toLowerCase();if(!['pdf','doc','docx','odt'].includes(ext))throw new Error('Formato inválido.');const path=`groups/${GROUP.code}/${st.code}/${Date.now()}-${safeName(file.name)}`;show('groupResult','info','Enviando arquivo...');const ur=await fetch(SUPA+'/storage/v1/object/ptcc-v2/'+path,{method:'POST',headers:headers({'Content-Type':file.type||'application/octet-stream','x-upsert':'false'}),body:file});if(!ur.ok)throw new Error('Falha ao enviar arquivo.');const sender=(await rest('ptcc_v2_members?group_id=eq.'+GROUP.id+'&email=ilike.'+encodeURIComponent(USER.email)+'&select=name,email&limit=1'))[0]||{name:USER.email,email:USER.email};const reg=await rpc('ptcc_v2_register_submission',{p_group:GROUP.id,p_stage:st.id,p_sender:sender.name,p_email:sender.email,p_path:path,p_filename:file.name});show('groupResult','ok',`Entrega registrada. Protocolo: <b>${esc(reg?.[0]?.protocol||'gerado')}</b>.`);await loadGroup()}catch(e){show('groupResult','err',esc(e.message))}}
function parseInvite(){const p=new URLSearchParams(location.hash.replace(/^#/,'')),a=p.get('access_token'),r=p.get('refresh_token');if(a){store(a,r);$('loginPanel').classList.add('hidden');$('setPasswordPanel').classList.remove('hidden');history.replaceState({},'',location.pathname)}}$('loginForm').onsubmit=async e=>{e.preventDefault();try{const r=await fetch(SUPA+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim().toLowerCase(),password:$('password').value})}),j=await r.json();if(!r.ok)throw new Error('E-mail ou senha inválidos.');store(j.access_token,j.refresh_token);await loadGroup()}catch(e){show('loginResult','err',esc(e.message))}};$('forgotBtn').onclick=async()=>{try{const email=$('email').value.trim().toLowerCase();if(!email)throw new Error('Informe seu e-mail.');await fetch(SUPA+'/auth/v1/recover?redirect_to='+encodeURIComponent(location.href.split('#')[0]),{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email})});show('loginResult','ok','Link de recuperação enviado.')}catch(e){show('loginResult','err',esc(e.message))}};$('savePasswordBtn').onclick=async()=>{try{const p=$('newPassword').value;if(p.length<6)throw new Error('Use pelo menos 6 caracteres.');const r=await fetch(SUPA+'/auth/v1/user',{method:'PUT',headers:headers({'Content-Type':'application/json'}),body:JSON.stringify({password:p})});if(!r.ok)throw new Error('Não foi possível salvar a senha.');await loadGroup()}catch(e){show('setResult','err',esc(e.message))}};$('logoutBtn').onclick=()=>{localStorage.removeItem(AT);localStorage.removeItem(RT);location.reload()};(async()=>{try{parseInvite();if(!$('setPasswordPanel').classList.contains('hidden'))return;token=localStorage.getItem(AT)||'';if(token)await loadGroup()}catch(e){localStorage.removeItem(AT);show('loginResult','err',esc(e.message))}})();
</script></body></html>
