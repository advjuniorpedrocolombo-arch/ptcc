<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PTCC — Painel do Professor</title>
<style>
html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif;background:#f4f7f8;color:#17313d}
#loading{max-width:720px;margin:70px auto;padding:28px;border:1px solid #dce5e9;border-radius:16px;background:#fff;box-shadow:0 12px 30px rgba(7,54,74,.10);text-align:center}
#loading b{display:block;color:#07364a;font-size:1.15rem;margin-bottom:8px}
#loading small{display:block;color:#6c7d86;line-height:1.45;margin-top:8px}
#error{display:none;margin-top:16px;padding:12px;border-radius:10px;background:#fff0ef;color:#8b3129;text-align:left;white-space:pre-wrap}
</style>
</head>
<body>
<div id="loading"><b>Carregando Painel do Professor...</b><span id="stage">Preparando a interface.</span><small>Se algum módulo falhar, a mensagem técnica aparecerá aqui para diagnóstico.</small><div id="error"></div></div>
<noscript><div style="padding:30px;text-align:center">Este painel precisa de JavaScript habilitado no navegador.</div></noscript>
<script>
(async()=>{
  const stage=document.getElementById('stage');
  const errBox=document.getElementById('error');
  const fail=(e)=>{const msg=e?.message||String(e||'Erro desconhecido');stage.textContent='Não foi possível abrir o painel.';errBox.style.display='block';errBox.textContent=msg+'\n\nAtualize a página. Se persistir, informe esta mensagem.';console.error('[PTCC professor]',e)};
  try{
    stage.textContent='Carregando painel principal...';
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),15000);
    const r=await fetch('./professor-app.html?v='+Date.now(),{cache:'no-store',signal:controller.signal});
    clearTimeout(timer);
    if(!r.ok)throw new Error('Falha HTTP '+r.status+' ao carregar professor-app.html.');
    let html=await r.text();
    if(!html.includes('PTCC — Painel do Professor'))throw new Error('O arquivo professor-app.html retornou conteúdo inesperado.');
    const v=Date.now();
    const modules=[
      'professor-nav.js',
      'professor-arquivos.js',
      'professor-semestre.js',
      'professor-grupos-ui.js',
      'professor-etapas.js',
      'professor-acesso.js'
    ];
    const injected=modules.map(f=>'<script src="./'+f+'?v='+v+'"><\\/script>').join('');
    html=html.replace('</body>',injected+'</body>');
    stage.textContent='Abrindo painel...';
    document.open();
    document.write(html);
    document.close();
  }catch(e){fail(e)}
})();
</script>
</body>
</html>
