<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PTCC — Painel do Professor</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f6f7}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="core" src="./painel-professor-v5.html" title="Painel do Professor"></iframe><script>
const frame=document.getElementById('core');let observer=null,patching=false,backupReady=false,backupSemester='';
function getVar(w,n,fallback){try{return w.eval(n)}catch{return fallback}}
function getRequests(w){return getVar(w,'REQ',[])}
function getToken(w){return getVar(w,'token','')}
function getConst(w,n){return getVar(w,n,'')}
async function cleanupStored(w,path){if(!path)return false;try{const SUPA=getConst(w,'SUPA'),KEY=getConst(w,'KEY'),token=getToken(w);if(!SUPA||!KEY||!token)return false;const r=await fetch(SUPA+'/storage/v1/object/ptcc-v2/'+path.split('/').map(encodeURIComponent).join('/'),{method:'DELETE',headers:{apikey:KEY,Authorization:'Bearer '+token}});return r.ok}catch{return false}}
async function deleteRequest(w,r){if(!r||r.status==='APPROVED'||r.group_id)return;const ok=confirm('Excluir definitivamente o cadastro '+r.protocol+' — '+(r.group_name||'equipe')+'?\n\nEsta ação só é permitida para cadastros ainda não aprovados.');if(!ok)return;try{w.show?.('requestActionResult','info','Excluindo cadastro...');const out=await w.rpc('ptcc_v2_delete_pending_request',{p_request:r.id});const info=Array.isArray(out)?out[0]:out;await Promise.allSettled([cleanupStored(w,info?.original_path),cleanupStored(w,info?.signed_path)]);w.show?.('requestActionResult','ok','Cadastro '+(info?.protocol||r.protocol)+' excluído com sucesso.');await w.loadData?.()}catch(e){w.show?.('requestActionResult','err',w.esc?w.esc(e.message):e.message)}}
function csv(rows){const cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';return '\ufeff'+rows.map(r=>r.map(cell).join(';')).join('\r\n')}
async function ensureZip(){if(window.JSZip)return;await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';s.onload=resolve;s.onerror=()=>reject(new Error('Não foi possível carregar o gerador de ZIP.'));document.head.appendChild(s)})}
function nextSemester(label){const m=String(label||'').match(/^(20\d{2})\/([12])$/);if(!m)return'';const y=Number(m[1]),s=Number(m[2]);return s===1?`${y}/2`:`${y+1}/1`}
async function readSettings(w){try{const a=await w.rest('ptcc_v2_settings?id=eq.1&select=*');return a?.[0]||{}}catch{return{}}}
async function fetchStored(w,path){const SUPA=getConst(w,'SUPA'),KEY=getConst(w,'KEY'),token=getToken(w);const r=await fetch(SUPA+'/storage/v1/object/authenticated/ptcc-v2/'+path.split('/').map(encodeURIComponent).join('/'),{headers:{apikey:KEY,Authorization:'Bearer '+token}});if(!r.ok)throw new Error('Falha ao baixar '+path);return r.blob()}
async function generateSemesterBackup(w){const d=frame.contentDocument,box=d.getElementById('semesterResult');try{box.className='result info';box.style.display='block';box.textContent='Preparando backup completo do semestre...';await ensureZip();await w.loadData?.();const REQ=getVar(w,'REQ',[]),GR=getVar(w,'GR',[]),MEM=getVar(w,'MEM',[]),ST=getVar(w,'ST',[]),GS=getVar(w,'GS',[]),SUB=getVar(w,'SUB',[]),AUDIT=getVar(w,'AUDIT',[]),ARCHIVES=getVar(w,'ARCHIVES',[]),ACCESS=getVar(w,'ACCESS',[]);const settings=await readSettings(w),schedule=(await w.rest('ptcc_v2_schedule_config?select=*')).at?.(0)||(await w.rest('ptcc_v2_schedule_config?select=*'))[0]||{};backupSemester=settings.semester_label||'semestre';const zip=new JSZip(),dados=zip.folder('dados');const all={settings,schedule,requests:REQ,groups:GR,members:MEM,stages:ST,group_stages:GS,submissions:SUB,audit:AUDIT,archives:ARCHIVES,access:ACCESS,exported_at:new Date().toISOString()};dados.file('backup-completo.json',JSON.stringify(all,null,2));dados.file('grupos-integrantes.csv',csv([['Grupo','Nome','Tema','Progresso','Integrante','E-mail','Função'],...GR.flatMap(g=>MEM.filter(m=>m.group_id===g.id).map(m=>[g.code,g.name,g.theme||'',g.progress,m.name,m.email,m.member_role]))]));dados.file('entregas.csv',csv([['Protocolo','Grupo','Etapa','Versão','Arquivo','Enviado por','E-mail','Status','Data envio','Data revisão','Observações'],...SUB.map(s=>{const g=GR.find(x=>x.id===s.group_id),st=ST.find(x=>x.id===s.stage_id);return[s.protocol,g?.code||'',st?.name||'',s.version,s.original_filename,s.submitted_by,s.submitted_email,s.status,s.submitted_at,s.reviewed_at||'',s.professor_feedback||'']})]));dados.file('historico-auditoria.csv',csv([['Data','Grupo','Ação','Usuário','Função','Detalhes'],...AUDIT.map(a=>{const g=GR.find(x=>x.id===a.group_id);return[a.created_at,g?.code||'',a.action,a.actor_email||'',a.actor_role||'',JSON.stringify(a.details||{})]})]));
const paths=[...new Set([...REQ.flatMap(r=>[r.original_path,r.signed_path]),...SUB.flatMap(s=>[s.file_path,s.feedback_file_path])].filter(Boolean))];let ok=0,fail=0;for(let i=0;i<paths.length;i++){const p=paths[i];box.textContent=`Baixando arquivos do semestre: ${i+1}/${paths.length}...`;try{const blob=await fetchStored(w,p);zip.file('arquivos/'+p,blob);ok++}catch(e){dados.file('ARQUIVOS_NAO_BAIXADOS.txt',(dados._missing||'')+p+'\n');dados._missing=(dados._missing||'')+p+'\n';fail++}}
const manifest={semester:backupSemester,generated_at:new Date().toISOString(),database_records:{requests:REQ.length,groups:GR.length,members:MEM.length,submissions:SUB.length,audit:AUDIT.length},storage_files:{expected:paths.length,downloaded:ok,failed:fail}};dados.file('manifesto-backup.json',JSON.stringify(manifest,null,2));const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='PTCC-backup-'+backupSemester.replace('/','-')+'-'+new Date().toISOString().slice(0,10)+'.zip';a.click();setTimeout(()=>URL.revokeObjectURL(u),60000);backupReady=true;const chk=d.getElementById('semesterBackupConfirmed'),btn=d.getElementById('semesterResetBtn');chk.disabled=false;btn.disabled=true;box.className='result '+(fail?'warn':'ok');box.style.display='block';box.innerHTML=`Backup ZIP gerado. <b>${ok}</b> arquivo(s) incluído(s)`+(fail?` e <b>${fail}</b> não puderam ser baixados. Não encerre o semestre até revisar o arquivo ARQUIVOS_NAO_BAIXADOS.txt.`:'. Agora confira se o ZIP foi salvo antes de liberar o encerramento.');}catch(e){backupReady=false;box.className='result err';box.style.display='block';box.textContent=e.message}}
async function closeSemester(w){const d=frame.contentDocument,box=d.getElementById('semesterResult'),newSem=d.getElementById('newSemester').value.trim(),typed=d.getElementById('semesterConfirmText').value.trim(),checked=d.getElementById('semesterBackupConfirmed').checked;if(!backupReady) return alert('Gere o backup ZIP antes de encerrar o semestre.');if(!checked)return alert('Confirme que o arquivo ZIP foi salvo.');if(typed!=='ENCERRAR SEMESTRE')return alert('Digite exatamente: ENCERRAR SEMESTRE');if(!/^20\d{2}\/[12]$/.test(newSem))return alert('Informe o novo semestre no formato AAAA/1 ou AAAA/2.');const ok=confirm('ÚLTIMA CONFIRMAÇÃO\n\nEncerrar '+backupSemester+' e preparar o sistema para '+newSem+'?\n\nSerão removidos os dados acadêmicos do semestre atual. A estrutura, o layout, as etapas e o painel serão preservados.');if(!ok)return;try{box.className='result info';box.style.display='block';box.textContent='Encerrando semestre com segurança...';const out=await w.rpc('ptcc_v2_prepare_new_semester',{p_new_semester:newSem,p_confirmation:'ENCERRAR SEMESTRE'});const files=out?.files||[];let removed=0;for(const p of files)if(await cleanupStored(w,p))removed++;box.className='result ok';box.style.display='block';box.innerHTML=`Semestre encerrado. Sistema preparado para <b>${newSem}</b>. Dados acadêmicos foram zerados e ${removed}/${files.length} arquivo(s) do Storage foram removidos. Contas de autenticação dos alunos foram preservadas para reutilização futura.`;backupReady=false;setTimeout(()=>frame.contentWindow.location.reload(),2500)}catch(e){box.className='result err';box.style.display='block';box.textContent=e.message}}
function addCloseoutPanel(w,d){if(d.getElementById('semesterCloseout'))return;const reports=d.getElementById('reports');if(!reports)return;const wrap=d.createElement('div');wrap.id='semesterCloseout';wrap.className='report-box';wrap.style.marginTop='14px';wrap.innerHTML=`<h3>Encerramento do semestre</h3><p class="sub">Fluxo protegido: primeiro gere e salve o ZIP. A estrutura do sistema, o layout e as etapas são preservados.</p><div class="actions"><button class="btn alt" id="semesterBackupBtn" type="button">⬇ Gerar backup ZIP do semestre</button></div><label style="margin-top:12px">Novo semestre<input id="newSemester" placeholder="2027/1"></label><label style="margin-top:10px;font-weight:700"><input id="semesterBackupConfirmed" type="checkbox" disabled style="width:auto;margin-right:6px">Confirmo que o ZIP foi salvo e conferido.</label><label>Confirmação final<input id="semesterConfirmText" placeholder="Digite: ENCERRAR SEMESTRE"></label><button class="btn bad" id="semesterResetBtn" type="button" disabled style="margin-top:10px">Encerrar semestre e preparar novo período</button><div id="semesterResult" class="result"></div>`;reports.appendChild(wrap);d.getElementById('semesterBackupBtn').onclick=()=>generateSemesterBackup(w);d.getElementById('semesterBackupConfirmed').onchange=e=>{d.getElementById('semesterResetBtn').disabled=!(backupReady&&e.target.checked)};d.getElementById('semesterResetBtn').onclick=()=>closeSemester(w);readSettings(w).then(s=>{d.getElementById('newSemester').value=nextSemester(s.semester_label)})}
function patch(){if(patching)return;patching=true;try{const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return;const body=d.getElementById('requestsBody');if(body){const req=getRequests(w);[...body.querySelectorAll(':scope > tr')].forEach((tr,i)=>{const r=req[i];if(!r||r.status==='APPROVED'||r.group_id||tr.querySelector('.ptcc-delete-request'))return;const td=tr.cells?.[5];if(!td)return;const box=d.createElement('div');box.className='actions ptcc-delete-request';box.style.marginTop='8px';const b=d.createElement('button');b.className='btn bad';b.type='button';b.textContent='🗑 Excluir cadastro';b.title='Excluir cadastro ainda não aprovado';b.onclick=ev=>{ev.preventDefault();ev.stopPropagation();deleteRequest(w,r)};box.appendChild(b);td.appendChild(box)})}addCloseoutPanel(w,d)}catch{}finally{patching=false}}
frame.addEventListener('load',()=>{try{const d=frame.contentDocument;observer?.disconnect();observer=new MutationObserver(()=>patch());observer.observe(d.documentElement,{subtree:true,childList:true});patch();setInterval(patch,1200)}catch{}});
</script></body></html>
