<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PTCC — Painel do Professor</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f6f7}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="core" src="./painel-professor-v5.html" title="Painel do Professor"></iframe><script>
const frame=document.getElementById('core');let observer=null,patching=false;
function getRequests(w){try{return w.eval('REQ')}catch{return[]}}
function getToken(w){try{return w.eval('token')}catch{return''}}
function getConst(w,n){try{return w.eval(n)}catch{return''}}
async function cleanupStored(w,path){if(!path)return;try{const SUPA=getConst(w,'SUPA'),KEY=getConst(w,'KEY'),token=getToken(w);if(!SUPA||!KEY||!token)return;await fetch(SUPA+'/storage/v1/object/ptcc-v2/'+path.split('/').map(encodeURIComponent).join('/'),{method:'DELETE',headers:{apikey:KEY,Authorization:'Bearer '+token}})}catch{}}
async function deleteRequest(w,r){if(!r||r.status==='APPROVED'||r.group_id)return;const ok=confirm('Excluir definitivamente o cadastro '+r.protocol+' — '+(r.group_name||'equipe')+'?\n\nEsta ação só é permitida para cadastros ainda não aprovados.');if(!ok)return;try{w.show?.('requestActionResult','info','Excluindo cadastro...');const out=await w.rpc('ptcc_v2_delete_pending_request',{p_request:r.id});const info=Array.isArray(out)?out[0]:out;await Promise.allSettled([cleanupStored(w,info?.original_path),cleanupStored(w,info?.signed_path)]);w.show?.('requestActionResult','ok','Cadastro '+(info?.protocol||r.protocol)+' excluído com sucesso.');await w.loadData?.()}catch(e){w.show?.('requestActionResult','err',w.esc? w.esc(e.message):e.message)}}
function patch(){if(patching)return;patching=true;try{const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return;const body=d.getElementById('requestsBody');if(!body)return;const req=getRequests(w);[...body.querySelectorAll(':scope > tr')].forEach((tr,i)=>{const r=req[i];if(!r||r.status==='APPROVED'||r.group_id||tr.querySelector('.ptcc-delete-request'))return;const td=tr.cells?.[5];if(!td)return;const box=d.createElement('div');box.className='actions ptcc-delete-request';box.style.marginTop='8px';const b=d.createElement('button');b.className='btn bad';b.type='button';b.textContent='🗑 Excluir cadastro';b.title='Excluir cadastro ainda não aprovado';b.onclick=ev=>{ev.preventDefault();ev.stopPropagation();deleteRequest(w,r)};box.appendChild(b);td.appendChild(box)});
}catch{}finally{patching=false}}
frame.addEventListener('load',()=>{try{const d=frame.contentDocument;observer?.disconnect();observer=new MutationObserver(()=>patch());observer.observe(d.documentElement,{subtree:true,childList:true});patch();setInterval(patch,1200)}catch{}});
</script></body></html>
